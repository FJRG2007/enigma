name: Landing page

# Build and deploy the static presentation + docs site (apps/web, Astro + MDX) to GitHub
# Pages. Brand assets are pulled from their single source of truth at build (apps/web's
# prebuild copies assets/logos + assets/images/dashboard.png into public/), so nothing is
# duplicated in the web app.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "assets/logos/**"
      - "assets/images/dashboard.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
