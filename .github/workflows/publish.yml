name: Publish enigma-cli

# Auto-publish to npm. Triggers:
#   - a published GitHub Release (recommended: create a release tagged vX.Y.Z)
#   - a push to main whose head commit message contains "publish:"
#   - manual run from the Actions tab (workflow_dispatch)
#
# Single-package distribution (opencode-style mechanism, ONE npm package): the `build`
# matrix compiles one Bun binary per OS on a NATIVE runner (cross-compiling OpenTUI's
# native FFI core is unreliable). The `publish` job collects their SHA256s into
# bin/checksums.json, uploads the binaries as assets on the Release tagged v<version>,
# then publishes the single `enigma-cli` package. At install time its postinstall
# downloads the host binary from that Release and verifies it against the checksum that
# shipped inside the (provenance-signed) tarball. No per-platform npm packages.
#
# Requires repo secret NPM_TOKEN (npm automation token with publish rights). Uses npm
# provenance (id-token: write) and uploads Release assets (contents: write).
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    # Publish on a release, a manual dispatch, or a push whose head commit message
    # contains "publish:". Plain pushes without that marker are ignored.
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'publish:'))
    strategy:
      fail-fast: true
      matrix:
        # Native runner per target (OpenTUI's native core only embeds reliably when
        # built on its own platform). Intel macOS (darwin-x64) is omitted: its only free
        # runner (macos-13) is deprecated/unavailable. The downloader errors cleanly on
        # an unsupported platform.
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, asset: enigma-linux-x64 }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, asset: enigma-linux-arm64 }
          - { os: macos-14, target: bun-darwin-arm64, asset: enigma-darwin-arm64 }
          - { os: windows-latest, target: bun-windows-x64, asset: enigma-win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs devDependencies including the host's @opentui/core native package,
      # which `bun build --compile` embeds into the binary.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile binary
        working-directory: packages/enigma-cli
        run: npm run build:binaries -- --target=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/enigma-cli/dist-bin/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci || npm install

      # Never publish a broken package: typecheck + integrity + guard first.
      - name: Verify
        run: npm run verify --workspace enigma-cli

      # Build dist/guard.js (the real guard file shipped in the main package).
      - name: Build guard
        run: npm run build --workspace enigma-cli

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/enigma-cli/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Guard against tag/version drift when triggered by a release.
      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          if [ "${{ steps.meta.outputs.tag }}" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json version (${{ steps.meta.outputs.tag }}) does not match release tag (${GITHUB_REF_NAME})"; exit 1
          fi

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: packages/enigma-cli/dist-bin
          merge-multiple: true

      # Record each binary's SHA256 in bin/checksums.json. This file ships inside the
      # npm tarball (covered by provenance) and is what the installer verifies against.
      - name: Assemble checksums.json
        working-directory: packages/enigma-cli
        run: |
          node -e '
            const fs = require("fs");
            const dir = "dist-bin";
            const out = {};
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".sha256")) continue;
              const asset = f.slice(0, -".sha256".length);
              out[asset] = fs.readFileSync(`${dir}/${f}`, "utf8").trim().split(/\s+/)[0];
            }
            if (!Object.keys(out).length) { console.error("no .sha256 files found"); process.exit(1); }
            fs.writeFileSync("bin/checksums.json", JSON.stringify(out, null, 2) + "\n");
            console.log("checksums.json:", out);
          '

      # Upload the binaries to the Release tagged v<version> (must already exist for a
      # release trigger; for dispatch/push the tag/release must have been created).
      - name: Upload binaries to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          gh release upload "${{ steps.meta.outputs.tag }}" \
            packages/enigma-cli/dist-bin/!(*.sha256) --clobber

      - name: Determine if version is new
        id: ver
        run: |
          NAME="$(node -p "require('./packages/enigma-cli/package.json').name")"
          if npm view "$NAME@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@${{ steps.meta.outputs.version }} already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.ver.outputs.publish == 'true'
        run: npm publish --workspace enigma-cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
