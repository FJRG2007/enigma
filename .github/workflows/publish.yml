name: Publish enigma-cli

# Release enigma-cli. Triggers:
#   - a published GitHub Release (recommended: create a release tagged vX.Y.Z)
#   - a push to main whose head commit message contains "publish:"
#   - manual run from the Actions tab (workflow_dispatch)
#
# Two independent delivery channels, so one going down never blocks the other:
#   1. GitHub Release (job `release`, needs only GITHUB_TOKEN). The `build` matrix compiles one
#      Bun binary per OS on a NATIVE runner (cross-compiling OpenTUI's native FFI core is
#      unreliable); `release` records their SHA256s in bin/checksums.json, `npm pack`s
#      enigma-cli (WITH that file inside) and every @enigmax package the CLI fetches on demand,
#      and uploads binaries + tarballs + a SHA256SUMS covering every asset to the Release tagged
#      v<version>. scripts/install.sh / install.ps1 and `enigma update` on a standalone install
#      use only this channel.
#   2. npm (job `npm`), run only when NPM_TOKEN authenticates. It publishes the single
#      `enigma-cli` package (postinstall downloads the host binary from the Release above and
#      verifies it against the checksums.json inside the provenance-signed tarball) and the
#      @enigmax packages whose version is new. An expired token or a suspended account turns
#      this into a warning and a skipped job; the Release has already shipped.
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm:
        description: Also publish to npm (off ships the GitHub Release only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Whether the npm credential works. Never fails the run: an npm outage, an expired token or a
  # suspended account must not stop the GitHub Release. npm answers an unauthenticated publish
  # with `E404 ... is not in this registry`, which reads as "no such package" and sends whoever
  # is on call looking at the wrong thing - so the check names the real cause itself. (Observed:
  # NPM_TOKEN last rotated 2026-06-01, publishes green through 2026-08-27 and 404 from
  # 2026-08-31 - a 90-day automation token expiring on schedule.)
  npm-auth:
    # Publish on a release, a manual dispatch, or a push whose head commit message
    # contains "publish:". Plain pushes without that marker are ignored.
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'publish:'))
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.whoami.outputs.ok }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: The npm token can publish
        id: whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::The NPM_TOKEN secret is empty or not set; the GitHub Release ships, npm is skipped."
            echo "Add an npm automation token with publish rights: Settings -> Secrets and variables -> Actions -> NPM_TOKEN."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! WHO="$(npm whoami 2>&1)"; then
            echo "::warning::npm rejected NPM_TOKEN, so npm is skipped (the GitHub Release still ships). npm said: $WHO"
            echo "Almost always an expired or revoked automation token (they carry an expiry), or a suspended account."
            echo "Mint a new one at npmjs.com -> Access Tokens -> Generate -> Automation, then update the NPM_TOKEN secret and re-run this workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Authenticated to npm as $WHO."
          echo "ok=true" >> "$GITHUB_OUTPUT"

  build:
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'publish:'))
    strategy:
      fail-fast: true
      matrix:
        # Native runner per target (OpenTUI's native core only embeds reliably when
        # built on its own platform). Intel macOS (darwin-x64) is omitted: its only free
        # runner (macos-13) is deprecated/unavailable. The downloader errors cleanly on
        # an unsupported platform. macos-14 was retired by GitHub ("configuration not
        # supported", Nov 2026); macos-15 is the arm64 image.
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, asset: enigma-linux-x64 }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, asset: enigma-linux-arm64 }
          - { os: macos-15, target: bun-darwin-arm64, asset: enigma-darwin-arm64 }
          - { os: windows-latest, target: bun-windows-x64, asset: enigma-win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs devDependencies including the host's @opentui/core native package,
      # which `bun build --compile` embeds into the binary.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile binary
        working-directory: packages/enigma-cli
        run: npm run build:binaries -- --target=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/enigma-cli/dist-bin/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      # Never release a broken package: typecheck + integrity + guard first.
      - name: Verify
        run: npm run verify --workspace enigma-cli

      # dist/ of enigma-cli (guard, hooks and the other Node bundles it ships) and of the linter,
      # so both tarballs are complete.
      - name: Build
        run: |
          npm run build --workspace enigma-cli
          npm run build --workspace @enigmax/linter

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/enigma-cli/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Guard against tag/version drift when triggered by a release.
      - name: Check version matches release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ "$TAG" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json version ($TAG) does not match release tag (${GITHUB_REF_NAME})"; exit 1
          fi

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: packages/enigma-cli/dist-bin
          merge-multiple: true

      # Record each binary's SHA256 in bin/checksums.json. This file ships inside the enigma-cli
      # tarball (on npm, covered by provenance) and is what the npm installer verifies against.
      - name: Assemble checksums.json
        working-directory: packages/enigma-cli
        run: |
          node -e '
            const fs = require("fs");
            const dir = "dist-bin";
            const out = {};
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".sha256")) continue;
              const asset = f.slice(0, -".sha256".length);
              out[asset] = fs.readFileSync(`${dir}/${f}`, "utf8").trim().split(/\s+/)[0];
            }
            if (!Object.keys(out).length) { console.error("no .sha256 files found"); process.exit(1); }
            fs.writeFileSync("bin/checksums.json", JSON.stringify(out, null, 2) + "\n");
            console.log("checksums.json:", out);
          '

      # Everything the standalone installer and the npm-free fallbacks fetch: the binaries, the
      # enigma-cli tarball (checksums.json inside) and every on-demand @enigmax package, plus one
      # SHA256SUMS over all of them - the integrity root of the npm-independent path.
      - name: Pack release assets
        run: |
          set -euo pipefail
          shopt -s extglob
          mkdir -p release-assets
          cp packages/enigma-cli/dist-bin/!(*.sha256) release-assets/
          for ws in enigma-cli @enigmax/dashboard @enigmax/helio @enigmax/orion @enigmax/vega @enigmax/linter; do
            npm pack --workspace "$ws" --pack-destination release-assets >/dev/null
          done
          # Not `grep -q`: it exits on the first match, tar dies of SIGPIPE, and pipefail fails the step.
          tar -tzf release-assets/enigma-cli-*.tgz | grep -x 'package/bin/checksums.json' >/dev/null || { echo "checksums.json missing from the enigma-cli tarball"; exit 1; }
          (cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Keep checksums.json for the npm job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums-json
          path: packages/enigma-cli/bin/checksums.json
          if-no-files-found: error
          retention-days: 1

      # Upload the assets to the Release tagged v<version>, creating that release when nothing
      # did it first. A release trigger always has one; the `publish:`-on-push and
      # workflow_dispatch paths do not, and the upload used to die there with "release not
      # found" AFTER building every binary. Creating it here is what makes those two paths
      # self-sufficient, and it is required rather than cosmetic: every install channel
      # downloads its binary from this release.
      #
      # Creating it with the default GITHUB_TOKEN does NOT re-trigger this workflow - Actions
      # does not raise events from that token - so there is no second run and no double
      # publish. The tag is created from the pushed commit as part of this, which is also what
      # keeps npm and git in sync on the push path.
      - name: Upload assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release $TAG yet - creating it from $GITHUB_SHA"
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" release-assets/* --clobber

  # npm runs after the Release exists (the npm package downloads its binary from it) and only
  # when the token authenticated. A failure here is red on its own job; the Release is already out.
  # A manual run with npm unticked skips it: the Release ships without touching the npm account.
  npm:
    needs: [npm-auth, release]
    if: needs.npm-auth.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build --workspace enigma-cli

      # The same checksums.json the Release's enigma-cli tarball carries.
      - name: Restore checksums.json
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checksums-json
          path: packages/enigma-cli/bin

      - name: Resolve version
        id: meta
        run: echo "version=$(node -p "require('./packages/enigma-cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine if version is new
        id: ver
        run: |
          NAME="$(node -p "require('./packages/enigma-cli/package.json').name")"
          if npm view "$NAME@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@${{ steps.meta.outputs.version }} already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.ver.outputs.publish == 'true'
        run: bash scripts/npm-publish.sh enigma-cli packages/enigma-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The dashboard UI (@enigmax/dashboard) is a separate, asset-only package that
      # enigma-cli installs on demand. Publish it (skip if its version already exists) so
      # the on-demand fetch and `enigma update` always find the latest UI. No build step:
      # the package ships only static assets.
      - name: Determine if dashboard version is new
        id: dashver
        run: |
          DV="$(node -p "require('./packages/dashboard/package.json').version")"
          if npm view "@enigmax/dashboard@$DV" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@enigmax/dashboard@$DV already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish dashboard UI
        if: steps.dashver.outputs.publish == 'true'
        run: bash scripts/npm-publish.sh @enigmax/dashboard packages/dashboard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @enigmax/helio is the optional Helio bug-bounty agent: an asset-only package
      # enigma-cli fetches on demand when the user enables the agent. Publish it (skip if
      # its version already exists) so the on-demand fetch and `enigma update` find it.
      # No build step: it ships only vendored static assets.
      - name: Determine if helio pack version is new
        id: heliover
        run: |
          HV="$(node -p "require('./packages/helio/package.json').version")"
          if npm view "@enigmax/helio@$HV" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@enigmax/helio@$HV already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish helio pack
        if: steps.heliover.outputs.publish == 'true'
        run: bash scripts/npm-publish.sh @enigmax/helio packages/helio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @enigmax/orion is the optional Orion agent (bugs, speed, scalability): asset-only, fetched on
      # demand when the user enables it. Same version guard as the agents above.
      - name: Determine if orion pack version is new
        id: orionver
        run: |
          OV="$(node -p "require('./packages/orion/package.json').version")"
          if npm view "@enigmax/orion@$OV" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@enigmax/orion@$OV already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish orion pack
        if: steps.orionver.outputs.publish == 'true'
        run: bash scripts/npm-publish.sh @enigmax/orion packages/orion
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @enigmax/vega is the optional Vega agent (reverse engineering): asset-only, fetched on demand
      # when the user enables it; enigma installs the REA engine it pins separately. Same version
      # guard as the agents above.
      - name: Determine if vega agent version is new
        id: vegaver
        run: |
          RV="$(node -p "require('./packages/vega/package.json').version")"
          if npm view "@enigmax/vega@$RV" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@enigmax/vega@$RV already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish vega agent
        if: steps.vegaver.outputs.publish == 'true'
        run: bash scripts/npm-publish.sh @enigmax/vega packages/vega
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
