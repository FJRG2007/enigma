name: Publish dashboard

# Fast, asset-only publish of @enigmax/dashboard. The main publish.yml compiles a Bun
# binary per OS (slow, queues runners) - pointless for the dashboard package, which ships
# only static assets. This runs on a dashboard version bump and publishes just that package,
# so a UI release reaches users via `enigma update` without waiting on the binary build.

on:
  push:
    branches: [main]
    paths:
      - "packages/dashboard/package.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # A publish with a bad credential comes back as `E404 ... is not in this registry`,
      # which reads as "no such package" and points at the wrong problem. Say it plainly.
      - name: The npm token can publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is empty or not set for this repository."
            exit 1
          fi
          if ! WHO="$(npm whoami 2>&1)"; then
            echo "::error::The NPM_TOKEN secret is set but npm rejected it, so nothing can be published."
            echo "npm said: $WHO"
            echo "Almost always an expired or revoked automation token. Mint a new one at npmjs.com -> Access Tokens -> Generate -> Automation, update the NPM_TOKEN secret, and re-run."
            exit 1
          fi
          echo "Authenticated to npm as $WHO."
      - name: Install dependencies
        run: npm ci || npm install
      - name: Publish @enigmax/dashboard if the version is new
        run: |
          DV="$(node -p "require('./packages/dashboard/package.json').version")"
          if npm view "@enigmax/dashboard@$DV" version >/dev/null 2>&1; then
            echo "@enigmax/dashboard@$DV already published; nothing to do."
            exit 0
          fi
          npm publish --workspace @enigmax/dashboard --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
