name: CI

# Deterministic enforcement gate. Skills/memory only persuade the agent; this
# workflow mechanically blocks merges that break the package's integrity rules.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reproducible install (dependency-policy): prefer the lockfile.
      - name: Install dependencies
        run: npm ci || npm install

      # Typecheck + skill integrity (catches silent stale-sha drift) + guard
      # over all tracked files (secrets, .env, node_modules, ...).
      - name: Verify
        run: npm run verify

      # The suite runs ONE PROCESS PER FILE (packages/enigma-cli/scripts/test.ts): every test
      # file points HOME / ENIGMA_CONFIG_HOME at its own scratch dir before importing the module
      # under test, and modules that resolve their paths at import make that a per-process
      # contract - loaded together, the files read each other's temp homes. One step rather than
      # one per file, so a new tests/*.test.ts is covered the day it lands instead of the day
      # someone remembers to list it here.
      - uses: oven-sh/setup-bun@v2
      - name: Test (one process per file)
        run: npm test

      # The package must build (tsup) so dist is publishable.
      - name: Build
        run: npm run build

      # .githooks/guard.mjs is a copy of the built dist/guard.js, so it goes stale silently
      # whenever src/guard.ts changes: the hook keeps passing while running an older engine.
      - name: Committed guard hook is in sync with its source
        run: npm run check:hooks

      # The dashboard is one static file with no bundler, so it takes the primitives core as a
      # committed build beside Chart.js. An edit to the package that never reaches that copy
      # would be invisible until someone opened the palette and found the old behaviour.
      - name: Vendored primitives bundle is in sync with the package
        run: npm run check:vendor

      # The toast theme is a string the component injects AND a stylesheet consumers import;
      # the second is generated from the first, so a hand edit to it would be silently lost.
      - name: Generated stylesheets are in sync with their source
        run: npm run check:recipes

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck and build the component packages
        run: |
          npm run --workspace @enigmax/primitives typecheck
          npm run --workspace @enigmax/utils typecheck
          npm run --workspace @enigmax/icons typecheck
          npm run build:components

      # Pure logic: cache dedupe/TTL and the notification queue's held timers.
      - name: Test @enigmax/utils
        run: npm run --workspace @enigmax/utils test

      # The generated tree against the map that produced it. A name added to the map and
      # never generated, or a body that came out empty, renders an invisible square that
      # nothing at runtime would ever report.
      - name: Test @enigmax/icons
        run: npm run --workspace @enigmax/icons test

      # The marquee's guarantees are timing and pointer behaviour, so they are only
      # real when measured in a browser: the suite samples the track's computed
      # transform per animation frame rather than asking the engine what it believes.
      - name: Install Chromium for the browser suite
        run: npx playwright install --with-deps chromium
        working-directory: packages/primitives
      - name: Test @enigmax/primitives
        run: npm run --workspace @enigmax/primitives test

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changed-files diff below resolves

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      # Gate the @enigmax/linter package: typecheck, tests, and a build.
      - name: Typecheck, test, build
        run: |
          npm run --workspace @enigmax/linter typecheck
          npm run --workspace @enigmax/linter test
          npm run --workspace @enigmax/linter build

      # Dogfood: audit the repo's source for hardcoded secrets with the linter.
      - name: Secret audit (enigmax-lint)
        run: node packages/linter/dist/cli.js --audit-only packages

      # Ciphera-style gate on the ADDED/MODIFIED lines of the diff only (a ratchet,
      # mirroring the pre-commit hook): new/edited lines must be clean; a file's
      # pre-existing warnings do not block. The whole-repo backlog is fixed
      # opportunistically, not gated.
      - name: Ciphera-style lint (changed lines)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            # NOT --depth=1: the checkout above is already full, and a shallow fetch grafts the
            # base as a root with no history in common, so `base...HEAD` dies with "no merge
            # base". It only shows up once the base moves after the checkout - i.e. whenever
            # another PR merges first.
            git fetch origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify -q "${{ github.event.before }}" >/dev/null; then
            range="${{ github.event.before }}...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          echo "Diff range: $range"
          npm run -s lint:changed -- --range "$range"
