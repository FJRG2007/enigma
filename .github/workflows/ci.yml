name: CI

# Deterministic enforcement gate. Skills/memory only persuade the agent; this
# workflow mechanically blocks merges that break the package's integrity rules.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reproducible install (dependency-policy): prefer the lockfile.
      - name: Install dependencies
        run: npm ci || npm install

      # Typecheck + skill integrity (catches silent stale-sha drift) + guard
      # over all tracked files (secrets, .env, node_modules, ...).
      - name: Verify
        run: npm run verify

      # Unit tests that need the Bun test runner (network is stubbed; no TTY).
      - uses: oven-sh/setup-bun@v2
      - name: Test remote skill updates
        run: bun test tests/skills-remote.test.ts
        working-directory: packages/enigma-cli
      - name: Test local dashboard
        run: bun test tests/dashboard.test.ts
        working-directory: packages/enigma-cli
      - name: Test dashboard exposure and token auth
        run: bun test tests/dashboard-expose.test.ts
        working-directory: packages/enigma-cli
      - name: Test gh telemetry reporting
        run: bun test tests/github.test.ts
        working-directory: packages/enigma-cli
      - name: Test package update checker
        run: bun test tests/dashboard-updates.test.ts
        working-directory: packages/enigma-cli
      - name: Test usage observer
        run: bun test tests/usage.test.ts
        working-directory: packages/enigma-cli
      - name: Test measuring proxy
        run: bun test tests/proxy.test.ts
        working-directory: packages/enigma-cli
      - name: Test local API server
        run: bun test tests/api-server.test.ts
        working-directory: packages/enigma-cli
      - name: Test Kimi Code wiring
        run: bun test tests/kimi.test.ts
        working-directory: packages/enigma-cli
      - name: Test API playground
        run: bun test tests/api-playground.test.ts
        working-directory: packages/enigma-cli
      - name: Test live usage probe
        run: bun test tests/claude-usage-api.test.ts
        working-directory: packages/enigma-cli
      - name: Test guard config
        run: bun test tests/guard-config.test.ts
        working-directory: packages/enigma-cli
      - name: Test commit guard scan modes
        run: bun test tests/guard.test.ts
        working-directory: packages/enigma-cli
      - name: Test install options
        run: bun test tests/install-options.test.ts
        working-directory: packages/enigma-cli
      - name: Test tool-path repair
        run: bun test tests/tool-path.test.ts
        working-directory: packages/enigma-cli
      - name: Test marketplace packs
        run: bun test tests/packs.test.ts
        working-directory: packages/enigma-cli
      - name: Test SSH connection manager
        run: bun test tests/ssh.test.ts
        working-directory: packages/enigma-cli
      - name: Test SSH standalone tunnels
        run: bun test tests/ssh-tunnels.test.ts
        working-directory: packages/enigma-cli
      - name: Test dashboard SSH bridge
        run: bun test tests/dashboard-ssh.test.ts
        working-directory: packages/enigma-cli
      - name: Test gate CLI ergonomics
        run: bun test tests/gate-cli.test.ts
        working-directory: packages/enigma-cli
      - name: Test gate pipeline internals
        run: bun test tests/gate/
        working-directory: packages/enigma-cli
      - name: Test gate delivery on sync
        run: bun test tests/sync-gate.test.ts
        working-directory: packages/enigma-cli
      - name: Test Claude session reuse/transfer
        run: bun test tests/claude-oauth.test.ts
        working-directory: packages/enigma-cli
      - name: Test dashboard accounts bridge
        run: bun test tests/dashboard-accounts.test.ts
        working-directory: packages/enigma-cli
      - name: Test per-agent skill scoping
        run: bun test tests/skill-agent-scope.test.ts
        working-directory: packages/enigma-cli
      - name: Test autoskills detection
        run: bun test tests/autoskills.test.ts
        working-directory: packages/enigma-cli
      - name: Test gate command deploy toggle
        run: bun test tests/command-deploy.test.ts
        working-directory: packages/enigma-cli
      - name: Test per-project dashboard management
        run: bun test tests/dashboard-projects.test.ts
        working-directory: packages/enigma-cli
      - name: Test agent memory editor
        run: bun test tests/memory-edit.test.ts
        working-directory: packages/enigma-cli
      - name: Test config-in-skill rendering
        run: bun test tests/skill-config.test.ts
        working-directory: packages/enigma-cli
      - name: Test generalization rule tiering
        run: bun test tests/policy-generalization.test.ts
        working-directory: packages/enigma-cli
      - name: Test token-efficient output memory block
        run: bun test tests/memory-output-style.test.ts
        working-directory: packages/enigma-cli
      - name: Test recall session memory
        run: bun test tests/recall.test.ts
        working-directory: packages/enigma-cli
      - name: Test code-graph integration
        run: bun test tests/codegraph.test.ts
        working-directory: packages/enigma-cli
      - name: Test code-graph retrieval
        run: bun test tests/codegraph-query.test.ts
        working-directory: packages/enigma-cli
      - name: Test code-graph session hooks
        run: bun test tests/codegraph-hooks.test.ts
        working-directory: packages/enigma-cli
      - name: Test guardrails engine
        run: bun test tests/guardrails.test.ts
        working-directory: packages/enigma-cli
      - name: Test guardrails rule precision
        run: bun test tests/guardrails-rules.test.ts
        working-directory: packages/enigma-cli
      - name: Test guardrails deployment
        run: bun test tests/guardrails-deploy.test.ts
        working-directory: packages/enigma-cli
