        run: bun test tests/trim.test.ts
        working-directory: packages/enigma-cli
      - name: Test EOF trimmer deployment
        run: bun test tests/trim-deploy.test.ts
        working-directory: packages/enigma-cli
      - name: Test completion gate
        run: bun test tests/verify.test.ts
        working-directory: packages/enigma-cli
      - name: Test completion gate deployment
        run: bun test tests/verify-deploy.test.ts
        working-directory: packages/enigma-cli
      - name: Test accounts and provider overrides
        run: bun test tests/accounts.test.ts
        working-directory: packages/enigma-cli
      - name: Test hub TUI
        run: bun test tests/tui.hub.test.ts
        working-directory: packages/enigma-cli
      - name: Test SSH panel TUI
        run: bun test tests/tui.ssh.test.ts
        working-directory: packages/enigma-cli
      - name: Test provider editor TUI
        run: bun test tests/tui.provider.test.ts
        working-directory: packages/enigma-cli
      - name: Test CLI command dispatch
        run: bun test tests/cli-dispatch.test.ts
        working-directory: packages/enigma-cli

      # The package must build (tsup) so dist is publishable.
      - name: Build
        run: npm run build

      # .githooks/guard.mjs is a copy of the built dist/guard.js, so it goes stale silently
      # whenever src/guard.ts changes: the hook keeps passing while running an older engine.
      - name: Committed guard hook is in sync with its source
        run: npm run check:hooks

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck and build the component packages
        run: |
          npm run --workspace @enigmax/primitives typecheck
          npm run --workspace @enigmax/utils typecheck
          npm run build:components

      # Pure logic: cache dedupe/TTL and the notification queue's held timers.
      - name: Test @enigmax/utils
        run: npm run --workspace @enigmax/utils test

      # The marquee's guarantees are timing and pointer behaviour, so they are only
      # real when measured in a browser: the suite samples the track's computed
      # transform per animation frame rather than asking the engine what it believes.
      - name: Install Chromium for the browser suite
        run: npx playwright install --with-deps chromium
        working-directory: packages/primitives
      - name: Test @enigmax/primitives
        run: npm run --workspace @enigmax/primitives test

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changed-files diff below resolves

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      # Gate the @enigmax/linter package: typecheck, tests, and a build.
      - name: Typecheck, test, build
        run: |
          npm run --workspace @enigmax/linter typecheck
          npm run --workspace @enigmax/linter test
          npm run --workspace @enigmax/linter build

      # Dogfood: audit the repo's source for hardcoded secrets with the linter.
      - name: Secret audit (enigmax-lint)
        run: node packages/linter/dist/cli.js --audit-only packages

      # Ciphera-style gate on the ADDED/MODIFIED lines of the diff only (a ratchet,
      # mirroring the pre-commit hook): new/edited lines must be clean; a file's
      # pre-existing warnings do not block. The whole-repo backlog is fixed
      # opportunistically, not gated.
      - name: Ciphera-style lint (changed lines)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            # NOT --depth=1: the checkout above is already full, and a shallow fetch grafts the
            # base as a root with no history in common, so `base...HEAD` dies with "no merge
            # base". It only shows up once the base moves after the checkout - i.e. whenever
            # another PR merges first.
            git fetch origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify -q "${{ github.event.before }}" >/dev/null; then
            range="${{ github.event.before }}...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          echo "Diff range: $range"
          npm run -s lint:changed -- --range "$range"
