name: Dashboard preview

# Regenerate the README's dashboard preview whenever the dashboard UI or its version changes.
# Renders the REAL shipped assets with mock data (scripts/screenshot.mjs) via a headless
# browser at a wide 2558x1276 frame, then commits docs/images/dashboard.png to main (the
# README references that path). The PNG is also uploaded as a build artifact so the latest
# render is always retrievable even if the commit step is blocked by branch protection.

on:
  push:
    branches: [main]
    paths:
      - "packages/dashboard/assets/**"
      - "packages/dashboard/package.json"
      - "scripts/screenshot.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Playwright is CI-only and never a package dependency: install it ephemerally.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render dashboard preview
        run: node scripts/screenshot.mjs

      # Always retrievable, even if the commit-to-main step is blocked by branch protection.
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: docs/images/dashboard.png
          if-no-files-found: error

      - name: Commit preview to main
        run: |
          test -f docs/images/dashboard.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/dashboard.png
          if git diff --cached --quiet; then echo "preview unchanged"; exit 0; fi
          git commit -m "chore: refresh dashboard preview [skip ci]"
          # main has branch protection, so the bot's push may be rejected (GH013). That is
          # expected and must NOT fail the workflow - the rendered PNG is uploaded as an
          # artifact above and can be committed manually. Only a real (non-protection) error
          # should fail the job.
          if git push origin HEAD:main 2>push.log; then
            echo "preview pushed"
          elif grep -qiE "GH013|protected|rule violation|not permitted|denied" push.log; then
            echo "::warning::Preview push blocked by branch protection - download the dashboard-preview artifact and commit docs/images/dashboard.png manually."
            cat push.log
          else
            echo "::error::Unexpected push failure"; cat push.log; exit 1
          fi
