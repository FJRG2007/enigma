name: Publish @enigmax/linter

# Publish the @enigmax/linter package to npm. Separate from the enigma-cli
# publish so the two version independently. Manual only (workflow_dispatch from
# the Actions tab) to avoid accidental publishes - a commit-message marker is too
# easy to trip (e.g. a message that merely describes the trigger).
#
# Reuses the repo secret NPM_TOKEN (must have publish rights for the @enigmax
# scope). Uses npm provenance, so the job needs id-token: write.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # A publish with a bad credential comes back as `E404 ... is not in this registry`,
      # which reads as "no such package" and points at the wrong problem. Say it plainly.
      - name: The npm token can publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is empty or not set for this repository."
            exit 1
          fi
          if ! WHO="$(npm whoami 2>&1)"; then
            echo "::error::The NPM_TOKEN secret is set but npm rejected it, so nothing can be published."
            echo "npm said: $WHO"
            echo "Almost always an expired or revoked automation token. Mint a new one at npmjs.com -> Access Tokens -> Generate -> Automation, update the NPM_TOKEN secret, and re-run."
            exit 1
          fi
          echo "Authenticated to npm as $WHO."
      - name: Install dependencies
        run: npm ci || npm install

      # Never publish a broken package: typecheck + tests, then build the dist.
      - name: Verify
        run: |
          npm run --workspace @enigmax/linter typecheck
          npm run --workspace @enigmax/linter test

      - name: Build
        run: npm run --workspace @enigmax/linter build

      # Skip cleanly if this exact version is already on npm.
      - name: Determine if version is new
        id: ver
        run: |
          NAME="$(node -p "require('./packages/linter/package.json').name")"
          VERSION="$(node -p "require('./packages/linter/package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.ver.outputs.publish == 'true'
        run: npm publish --workspace @enigmax/linter --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
