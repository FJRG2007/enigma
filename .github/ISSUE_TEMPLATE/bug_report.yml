name: Bug report
description: Something in enigma does not work as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the environment
        details accurately - most enigma issues are OS-, tool-, or terminal-specific.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: >-
            I have searched the existing issues (open and closed) and confirmed this
            is not a duplicate. I understand that knowingly filing duplicates may
            result in a sanction or limits on participating in this repository.
          required: true
        - label: I am running the latest published version of enigma-cli (`npm i -g enigma-cli@latest`).
          required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: >-
        The version of the operating system you selected above.
      placeholder: "e.g. Windows 11 Pro 24H2 / macOS 15.2 / Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Coding agent
      description: Which agent(s) were you using enigma with when the bug happened?
      multiple: true
      options:
        - Claude Code
        - OpenAI Codex
        - OpenCode
        - Other
        - None (the bug is in enigma itself)
    validations:
      required: true

  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - Warp
        - Windows Terminal
        - Windows PowerShell
        - Windows CMD
        - Bash
        - Zsh
        - Fish
        - iTerm2
        - GNOME Terminal / Konsole
        - VS Code integrated terminal
        - Other
    validations:
      required: true

  - type: input
    id: enigma-version
    attributes:
      label: enigma version
      description: Output of `enigma version`.
      placeholder: "e.g. 1.6.9"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - npm install -g enigma-cli
        - npx enigma-cli
        - From source (this repo)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `enigma ...`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste the terminal output. This is formatted automatically; no backticks needed.
      render: shell
    validations:
      required: false
